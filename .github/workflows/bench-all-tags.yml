name: Benchmark all tags

on:
  workflow_dispatch:
    inputs:
      tags_mode:
        description: "all | last:N (ex last:10)"
        required: false
        default: "last:2"
      benchs:
        description: "small,medium,large,wide"
        required: false
        default: "small,medium,large,wide"
      runs_fast:
        description: "Runs for old tags"
        required: false
        default: "3"
      runs_slow:
        description: "Runs for newest tag(s)"
        required: false
        default: "10"
      baseline_tags:
        description: "How many newest tags get runs_slow, -1 for all"
        required: false
        default: "1"

jobs:
  bench-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Install pnpm"
        uses: pnpm/action-setup@v4

      - name: "Bump Node.js to v25"
        uses: actions/setup-node@v6
        with:
          check-latest: true
          cache: "pnpm"
          node-version: 25

      - name: "Install Bun"
        uses: oven-sh/setup-bun@v2

      - name: "Install hyperfine and latest 7zip version"
        run: |
          wget https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          sudo dpkg -i hyperfine_1.20.0_amd64.deb
          rm hyperfine_1.20.0_amd64.deb
          sudo add-apt-repository ppa:apt-fast/stable -y
          sudo apt-get update && sudo apt-get install -y apt-fast
          echo 'DOWNLOADBEFORE=true' | sudo tee -a /etc/apt-fast.conf
          sudo apt-fast upgrade -y
          sudo apt-fast remove -y p7zip-full p7zip-rar && sudo apt-fast install -y 7zip 7zip-rar

      - name: "Install deps once (store cached)"
        run: pnpm i --frozen-lockfile

      - name: "Run tag sweep"
        env:
          TAGS_MODE: ${{ github.event.inputs.tags_mode }}
          BENCHS: ${{ github.event.inputs.benchs }}
          RUNS_FAST: ${{ github.event.inputs.runs_fast }}
          RUNS_SLOW: ${{ github.event.inputs.runs_slow }}
          BASELINE_TAGS: ${{ github.event.inputs.baseline_tags }}
          INCLUDE_REF: "true"
          REF_LABEL: ${{ github.ref_name }}
        run: |
          chmod +x .github/workflows/bench-all-tags.sh
          .github/workflows/bench-all-tags.sh

      - name: "Upload benchmark history"
        uses: actions/upload-artifact@v7
        with:
          name: bench-history
          path: tests/benchmarks/history/**/*.json
