              "packages/create-turbo": "313f01299b24cc0a9e16b73b0602fe25de28fd10c4c9a6810104f28349a45b2e",
              "packages/eslint-config-turbo": "0e7b1d760f0111326b165a7f6c2bb3c8b2d68977f756c5f0a2ff4a82f796dc69",
              "packages/eslint-plugin-turbo": "653526f371e5396b39fba7ae76fd07242742260ff1a620a295806a1033f089c2",
              "packages/tsconfig": "5a1be3cdfbe61dfbb1f0d95c6a421c1ff54edb120c66306f987b167d76f42efb",
              "packages/turbo-codemod": "c03944d2433b694b67349bffef3626be9b71058519b7d4b1e26747506561952a",
              "packages/turbo-gen": "4702bd00e37dd8ddf7c8f827d427ebcb09265328c0ac7dc3749fae7cde049e74",
              "packages/turbo-ignore": "13c2b09abfa384d020846b96e4523085b370e99c9d129ba6714b086c2c711777",
              "packages/turbo-releaser": "245a52829480d099b463b84c5655d06844f3ef6e3a4d185a9e8a4e81e36c09e2",
              "packages/turbo-repository": "8c1ec01e2f1f64e2f3c7d20de140281933e53f112619052f0392756d27d6deda",
              "packages/turbo-telemetry": "5425e0891fac21b1f20f8c6c5fc4994e5acda468f3384b46e6a2aa126c43ecde",
              "packages/turbo-test-utils": "af3e9e710c83f932a9e45ec54644249fb4658af57c649cb1ad1ad15dc37575a5",
              "packages/turbo-types": "bdfabe35d799e9927e8c96c6eb67fadc459a88e4c34d77e1dca0338f49e40a28",
              "packages/turbo-utils": "7bd10a26fa22d3f7ef8ded5c2656c2fbce2210bd4c876e0a54f62412d8f5833b",
              "packages/turbo-vsc": "bea42056528fb853a85b3f76c257a4c084c1348bc4eadbea0d934d2dce6ad642",
              "packages/turbo-workspaces": "cc6e6c54ad159f8288bdc0130792304ebaa4493902740ece558fad86a48d7fab",
              "turborepo-tests/helpers": "6b9d456b776fa165f4eeada38726c8d7217b343d5236fc354941d7a749ebbbd3"
            }
          }
        ]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PNPM"
        uses: pnpm/action-setup@v6

      - name: "Bump Node to v26"
        uses: actions/setup-node@v7
        with:
          check-latest: true
          cache: "pnpm"
          node-version: 26

      - name: "Install Go"
        uses: actions/setup-go@v7
        with:
          cache-dependency-path: "./src/go/go.sum"
          check-latest: true
          go-version: "stable"

      - name: "Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          rust-src-dir: ./src/rust
          toolchain: stable

      - name: "Install dependencies"
        run: |
          mkdir -p dist && echo "console.info('dev')" >> dist/install-binary.mjs
          pnpm i --frozen-lockfile
          cd src/go && go mod download
          cd ../rust && cargo fetch --locked

      - name: "Build runtimes and check ecosystem repositories"
        shell: bash
        run: |
          mkdir -p "$ECOSYSTEM_WORKDIR"

          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process"
          import { appendFileSync, existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } from "node:fs"
          import { join, resolve } from "node:path"

          const workspaceRoot = process.cwd()
          const ecosystemWorkdir = resolve(process.env["ECOSYSTEM_WORKDIR"] ?? ".github/tmp/ecosystem")
          const summaryPath = join(ecosystemWorkdir, "ecosystem-summary.md")
          const summaryOutputPath = process.env["GITHUB_STEP_SUMMARY"]

          mkdirSync(ecosystemWorkdir, { recursive: true })

          function quoteForDisplay(command) {
            return `\`${command}\``
          }

          function run(command, args, options = {}) {
            const result = spawnSync(command, args, {
              cwd: options.cwd ?? workspaceRoot,
              encoding: "utf8",
              maxBuffer: 10 * 1024 * 1024,
            })

            return {
              command: [ command, ...args ].join(" "),
              status: result.status ?? 1,
              stdout: result.stdout ?? "",
              stderr: result.stderr ?? "",
              error: result.error
                ? String(result.error)
                : "",
            }
          }

          function safeCodeBlock(value, language = "") {
            const text = value && value.trim()
              ? value.trim()
              : "(empty)"

            return `\n\n\`\`\`${language}\n${text}\n\`\`\``
          }

          function sortJsonValue(value) {
            if (Array.isArray(value)) {
              return value.map(sortJsonValue)
            }

            if (value && typeof value === "object") {
              return Object.fromEntries(Object.entries(value)
                .toSorted(([left], [right]) => left.localeCompare(right))
                .map(([ key, nestedValue ]) => [ key, sortJsonValue(nestedValue) ]))
            }

            return value
          }

          function prettyJson(value) {
            const parsed = typeof value === "string"
              ? JSON.parse(value)
              : value

            return JSON.stringify(sortJsonValue(parsed), null, 2)
          }

          function sanitizeName(value) {
            return value.toLowerCase()
              .replace(/[^a-z0-9._-]+/g, "-")
              .replace(/^-+|-+$/g, "") || "repo"
          }

          function formatExitStatus(status) {
            return typeof status === "number"
              ? String(status)
              : "unknown"
          }

          function loadRepos() {
            const raw = process.env["ECOSYSTEM_REPOS"] ?? "[]"

            try {
              const parsed = JSON.parse(raw)

              if (!Array.isArray(parsed)) {
                throw new TypeError("ECOSYSTEM_REPOS must be a JSON array")
              }

              return {
                repos: parsed, error: null,
              }
            } catch (error) {
              return {
                repos: [],
                error: error instanceof Error
                  ? error.message
                  : String(error),
              }
            }
          }

          function detectNodeEntrypoint() {
            const candidates = [
              resolve(workspaceRoot, "dist/monorepo-hash.mjs"),
              resolve(workspaceRoot, "dist/monorepo-hash.js"),
            ]

            return candidates.find((candidate) => existsSync(candidate)) ?? null
          }

          const buildPlan = [
            {
              key: "node",
              label: "Node",
              build: [ "pnpm", ["build:node"]],
              resolveCommand: () => {
                const entrypoint = detectNodeEntrypoint()

                return entrypoint
                  ? [ "node", [entrypoint]]
                  : null
              },
            },
            {
              key: "go",
              label: "Go",
              build: [ "pnpm", [ "cli:build-bin", "-r", "go", "-p", "linux-x64" ]],
              resolveCommand: () => {
                const binary = resolve(workspaceRoot, "go-build/monorepo-hash-linux-x64")

                return existsSync(binary)
                  ? [ binary, []]
                  : null
              },
            },
            {
              key: "rust",
              label: "Rust",
              build: [ "pnpm", [ "cli:build-bin", "-r", "rust", "-p", "linux-x64" ]],
              resolveCommand: () => {
                const binary = resolve(workspaceRoot, "rust-build/monorepo-hash-linux-x64")

                return existsSync(binary)
                  ? [ binary, []]
                  : null
              },
            },
          ]

          const buildResults = []

          for (const runtime of buildPlan) {
            const [ buildCommand, buildArgs ] = runtime.build
            const buildResult = run(buildCommand, buildArgs)

            let finalStatus = buildResult.status
            let combinedStdout = buildResult.stdout
            let combinedStderr = buildResult.stderr

            if (finalStatus === 0 && runtime.key !== "node") {
              const chmodResult = run("pnpm", ["cli:chmod"])

              combinedStdout += chmodResult.stdout
              combinedStderr += chmodResult.stderr

              if (chmodResult.status !== 0) {
                finalStatus = chmodResult.status
              }
            }

            const commandSpec = runtime.resolveCommand()
            const available = finalStatus === 0 && commandSpec !== null

            buildResults.push({
              key: runtime.key,
              label: runtime.label,
              available,
              status: finalStatus,
              command: commandSpec,
              buildCommand: [ buildCommand, ...buildArgs ].join(" "),
              stdout: combinedStdout,
              stderr: combinedStderr,
            })
          }

          function cloneRepository(repo, repoDir) {
            rmSync(repoDir, {
              recursive: true, force: true,
            })
            mkdirSync(repoDir, { recursive: true })

            const steps = [
              run("git", [ "init", "--quiet" ], { cwd: repoDir }),
              run("git", [ "remote", "add", "origin", repo.url ], { cwd: repoDir }),
              run("git", [ "fetch", "--depth", "1", "origin", repo.commit ], { cwd: repoDir }),
              run("git", [ "-c", "advice.detachedHead=false", "checkout", "--detach", "FETCH_HEAD" ], { cwd: repoDir }),
            ]

            const failedStep = steps.find((step) => step.status !== 0)

            return {
              ok: !failedStep,
              steps,
              failedStep,
            }
          }

          function getGeneratedHash(repoDir) {
            const hashPath = join(repoDir, ".hash")

            if (!existsSync(hashPath)) {
              return {
                exists: false,
                raw: "",
                formatted: "",
                parseError: null,
              }
            }

            const raw = readFileSync(hashPath, "utf8")

            try {
              return {
                exists: true,
                raw,
                formatted: prettyJson(raw),
                parseError: null,
              }
            } catch (error) {
              return {
                exists: true,
                raw,
                formatted: raw,
                parseError: error instanceof Error
                  ? error.message
                  : String(error),
              }
            }
          }

          function getExpectedHash(repo) {
            try {
              return {
                ok: true,
                formatted: prettyJson(repo.expectedHash),
                error: null,
              }
            } catch (error) {
              return {
                ok: false,
                formatted: "",
                error: error instanceof Error
                  ? error.message
                  : String(error),
              }
            }
          }

          function runRuntime(runtime, repo, repoDir, expectedHash) {
            if (!runtime.available || runtime.command === null) {
              return {
                runtime: runtime.label,
                ok: false,
                status: runtime.status,
                reason: `Build failed before execution (${formatExitStatus(runtime.status)})`,
                generatedHash: "",
                stdout: runtime.stdout,
                stderr: runtime.stderr,
              }
            }

            const [ command, baseArgs ] = runtime.command

            rmSync(join(repoDir, ".hash"), { force: true })
            rmSync(join(repoDir, ".debug-hash"), { force: true })
            const result = run(command, [ ...baseArgs, "-g" ], { cwd: repoDir })
            const generatedHash = getGeneratedHash(repoDir)

            if (!expectedHash.ok) {
              return {
                runtime: runtime.label,
                ok: false,
                status: result.status,
                reason: `Expected hash JSON is invalid (${expectedHash.error})`,
                generatedHash: generatedHash.formatted || generatedHash.raw,
                stdout: result.stdout,
                stderr: result.stderr,
              }
            }

            if (result.status !== 0) {
              return {
                runtime: runtime.label,
                ok: false,
                status: result.status,
                reason: `Exited with code ${formatExitStatus(result.status)}`,
                generatedHash: generatedHash.formatted || generatedHash.raw,
                stdout: result.stdout,
                stderr: result.stderr,
              }
            }

            if (!generatedHash.exists) {
              return {
                runtime: runtime.label,
                ok: false,
                status: result.status,
                reason: "Did not generate a root .hash file",
                generatedHash: "",
                stdout: result.stdout,
                stderr: result.stderr,
              }
            }

            if (generatedHash.parseError) {
              return {
                runtime: runtime.label,
                ok: false,
                status: result.status,
                reason: `Generated .hash is not valid JSON (${generatedHash.parseError})`,
                generatedHash: generatedHash.raw,
                stdout: result.stdout,
                stderr: result.stderr,
              }
            }

            if (generatedHash.formatted !== expectedHash.formatted) {
              return {
                runtime: runtime.label,
                ok: false,
                status: result.status,
                reason: "Generated .hash does not match the expected JSON",
                generatedHash: generatedHash.formatted,
                stdout: result.stdout,
                stderr: result.stderr,
              }
            }

            return {
              runtime: runtime.label,
              ok: true,
              status: result.status,
              reason: "Matched expected .hash",
              generatedHash: generatedHash.formatted,
              stdout: result.stdout,
              stderr: result.stderr,
            }
          }

          const repoList = loadRepos()
          const repoResults = []

          if (repoList.error) {
            repoResults.push({
              name: "ECOSYSTEM_REPOS",
              url: "",
              commit: "",
              cloneOk: false,
              cloneError: `Invalid ECOSYSTEM_REPOS JSON : ${repoList.error}`,
              runtimes: [],
            })
          } else {
            for (const [ index, repo ] of repoList.repos.entries()) {
              const repoName = typeof repo.name === "string" && repo.name.trim()
                ? repo.name.trim()
                : `repo-${index + 1}`
              const repoDir = join(ecosystemWorkdir, `${String(index + 1)
                .padStart(2, "0")}-${sanitizeName(repoName)}`)
              const expectedHash = getExpectedHash(repo)
              const hasValidUrl = typeof repo.url === "string" && repo.url.trim().length > 0
              const hasValidCommit = typeof repo.commit === "string" && repo.commit.trim().length > 0
              const cloneResult = hasValidUrl && hasValidCommit
                ? cloneRepository(repo, repoDir)
                : {
                    ok: false,
                    failedStep: {
                      command: "validate ecosystem repository definition",
                      status: 1,
                    },
                  }

              const repoResult = {
                name: repoName,
                url: typeof repo.url === "string"
                  ? repo.url
                  : "",
                commit: typeof repo.commit === "string"
                  ? repo.commit
                  : "",
                cloneOk: cloneResult.ok,
                cloneError: cloneResult.failedStep
                  ? `${cloneResult.failedStep.command} (exit ${formatExitStatus(cloneResult.failedStep.status)})`
                  : "",
                runtimes: [],
              }

              if (cloneResult.ok) {
                for (const runtime of buildResults) {
                  repoResult.runtimes.push(runRuntime(runtime, repo, repoDir, expectedHash))
                }
              }

              repoResults.push(repoResult)
            }
          }

          const summaryLines = []

          summaryLines.push("# Ecosystem verification summary")
          summaryLines.push("")
          summaryLines.push("## Runtime build status")
          summaryLines.push("")

          for (const runtime of buildResults) {
            summaryLines.push(`- ${runtime.available
              ? "✅"
              : "❌"} ${runtime.label} : exit ${formatExitStatus(runtime.status)} via ${quoteForDisplay(runtime.buildCommand)}`)

            if (!runtime.available) {
              if (runtime.stdout.trim()) {
                summaryLines.push(`  - stdout :${safeCodeBlock(runtime.stdout, "text")}`)
              }

              if (runtime.stderr.trim()) {
                summaryLines.push(`  - stderr :${safeCodeBlock(runtime.stderr, "text")}`)
              }
            }
          }

          summaryLines.push("")
          summaryLines.push("## Repository results")
          summaryLines.push("")

          for (const repo of repoResults) {
            const shortCommit = repo.commit
              ? repo.commit.slice(0, 12)
              : "unknown"
            const allRuntimeChecksPassed = repo.cloneOk && repo.runtimes.length > 0 && repo.runtimes.every((runtime) => runtime.ok)

            summaryLines.push(`### ${allRuntimeChecksPassed
              ? "✅"
              : "❌"} ${repo.name} (${shortCommit})`)
            summaryLines.push("")

            if (repo.url) {
              summaryLines.push(`- URL : ${quoteForDisplay(repo.url)}`)
            }

            if (repo.commit) {
              summaryLines.push(`- Commit : ${quoteForDisplay(repo.commit)}`)
            }

            if (!repo.cloneOk) {
              summaryLines.push(`- Clone : ❌ ${repo.cloneError}`)
              summaryLines.push("")

              continue
            }

            if (repo.runtimes.every((runtime) => runtime.ok)) {
              summaryLines.push("- Result : ✅ All 3 runtimes exited with 0 and matched the expected `.hash`")
              summaryLines.push("")

              continue
            }

            summaryLines.push("- Result : ❌ Failures detected")
            summaryLines.push("")

            for (const runtime of repo.runtimes.filter((rt) => !rt.ok)) {
              summaryLines.push(`- ${runtime.runtime} : exit ${formatExitStatus(runtime.status)} — ${runtime.reason}`)

              if (runtime.generatedHash) {
                summaryLines.push(`  - Generated ${quoteForDisplay(".hash")} :${safeCodeBlock(runtime.generatedHash, "json")}`)
              }

              if (runtime.stdout.trim()) {
                summaryLines.push(`  - stdout :${safeCodeBlock(runtime.stdout, "text")}`)
              }

              if (runtime.stderr.trim()) {
                summaryLines.push(`  - stderr :${safeCodeBlock(runtime.stderr, "text")}`)
              }
            }

            summaryLines.push("")
          }

          const summary = `${summaryLines.join("\n").trimEnd()}\n`

          writeFileSync(summaryPath, summary, "utf8")

          if (summaryOutputPath) {
            appendFileSync(summaryOutputPath, summary)
          }

          process.stdout.write(summary)
          NODE
