name: Run the tests suite

on:
  push:
    branches:
      - master
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  pr-check:
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.label.name == 'test-this') }}
    name: "Tests check"
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install pnpm"
        uses: pnpm/action-setup@v4

      - name: "Bump Node.js to v24"
        uses: actions/setup-node@v6
        with:
          check-latest: true
          cache: "pnpm"
          node-version: lts/krypton

      - name: "Install Bun"
        uses: oven-sh/setup-bun@v2

      - name: "Install dependencies"
        run: pnpm i --frozen-lockfile

      - name: "Lint check"
        run: pnpm lint
      
      - name: "Types check"
        run: pnpm typecheck
      
      - name: "Build the project"
        run: pnpm build && pnpm build:bun:linux-x64 && pnpm build:bun:linux-arm64 && pnpm build:bun:windows-x64:ci && pnpm build:bun:darwin-x64 && pnpm build:bun:darwin-arm64 && pnpm build:bun:linux-x64-musl && pnpm build:bun:linux-arm64-musl && pnpm build:bun:chmod

      - name: "Run the tests"
        run: pnpm vitest

      - name: "Prepare the binary tests"
        run: |
          sed -i 's#\.\./dist/monorepo-hash.mjs#\.\./bun-build/monorepo-hash-linux-x64#g' tests/setup.ts
          sed -i 's#monorepo-hash.mjs#monorepo-hash-linux-x64#g' tests/setup.ts
          find tests -name "*.test.ts" -exec sed -i 's#const cli = "node"#const cli = join(cwd, "monorepo-hash-linux-x64")#g; s#cliScript = join(cwd, "monorepo-hash.mjs")##g; s#\[ cliScript,#\[ #g' {} \;
          sed -i 's#const cli = join(cwd, "monorepo-hash-linux-x64")#const cli = "bun"#g; s#cliScript = join(cwd, "monorepo-hash.mjs")#cliScript = join(cwd, "monorepo-hash-bun.ts")#g' tests/workspaceDetection.test.ts
          sed -i '/describe("monorepo-hash output"/,${s#const cli = join(cwd, "monorepo-hash-linux-x64")#const cli = "bun"#g; s#cliScript = join(cwd, "monorepo-hash.mjs")#cliScript = join(cwd, "monorepo-hash-bun.ts")#g}' tests/output.test.ts

      - name: "Run the binary tests"
        run: pnpm vitest
