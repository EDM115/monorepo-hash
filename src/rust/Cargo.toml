[package]
edition = "2024"
name = "monorepo-hash"
publish = false
rust-version = "1.94"
version = "2.2.0"

[[bin]]
name = "monorepo-hash"
path = "monorepo-hash.rs"

[build-dependencies]
winres = "~0.1.12"

[package.metadata.winres]
Comments = "monorepo-hash"
CompanyName = "EDM115"
FileDescription = "monorepo-hash"
InternalName = "monorepo-hash"
LegalCopyright = "https://github.com/EDM115/monorepo-hash/blob/master/LICENSE"
OriginalFilename = "monorepo-hash.exe"
ProductName = "monorepo-hash"

[profile.release]
codegen-units = 1
incremental = true
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = true

[dependencies]
globwalk = "~0.9.1"
ignore = "~0.4.25"
serde = { version = "~1.0.228", features = ["derive"] }
serde_json = "~1.0.149"
serde_yaml = "~0.9.34"
sha2 = "~0.11.0"
