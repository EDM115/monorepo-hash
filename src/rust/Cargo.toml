[package]
edition = "2024"
name = "monorepo-hash"
publish = false
rust-version = "1.96.0"
version = "3.0.0"

[[bin]]
name = "monorepo-hash"
path = "monorepo-hash.rs"

[build-dependencies]
winresource = "~0.1.31"

[package.metadata.winresource]
Comments = "monorepo-hash"
CompanyName = "EDM115"
FileDescription = "monorepo-hash"
InternalName = "monorepo-hash"
LegalCopyright = "https://github.com/EDM115/monorepo-hash/blob/master/LICENSE"
OriginalFilename = "monorepo-hash.exe"
ProductName = "monorepo-hash"

[profile.release]
codegen-units = 1
incremental = true
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = true

[dependencies]
glob-match = "~0.2.1"
ignore = "~0.4.33"
jwalk = "~0.9.0" # deprecated, author recommends dua-core
rayon = "~1.12.0"
serde = { version = "~1.0.229", features = ["derive"] }
serde-saphyr = "~1.1.0"
serde_json = "~1.0.151"
sha2 = "~0.11.0"
